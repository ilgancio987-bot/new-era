<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<title>AstroLauncher</title>
<style>
:root{
  --bg:#0a0b0f; --side:#0e1015; --s1:#14171f; --s2:#1b1f2a; --s3:#252a38;
  --line:rgba(255,255,255,.07); --line2:rgba(255,255,255,.12);
  --txt:#eef0f6; --muted:#8b93a7; --dim:#5b6276;
  --acc:#5b8cff; --acc2:#8b5cf6; --ok:#34d399; --bad:#ff6b6b;
  --grad:linear-gradient(135deg,#5b8cff,#8b5cf6);
  --r:12px; --side-w:268px;
  --font:"Segoe UI Variable Text","Segoe UI",Inter,system-ui,sans-serif;
  --font-d:"Segoe UI Variable Display","Segoe UI",Inter,system-ui,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--txt);font:14px/1.45 var(--font);-webkit-font-smoothing:antialiased;user-select:none;overflow:hidden}
svg{flex-shrink:0}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
input,textarea,select{font:inherit;color:var(--txt);background:var(--s1);border:1px solid var(--line2);border-radius:10px;padding:11px 13px;width:100%;outline:none;transition:border-color .15s,box-shadow .15s;user-select:text}
input:focus,textarea:focus,select:focus{border-color:var(--acc);box-shadow:0 0 0 3px rgba(91,140,255,.18)}
textarea{resize:vertical;min-height:110px;line-height:1.5}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-thumb{background:#262b38;border-radius:10px;border:3px solid transparent;background-clip:padding-box}
::-webkit-scrollbar-thumb:hover{background-color:#343a4b}

/* --- bottoni --- */
.btn{display:inline-flex;align-items:center;gap:8px;height:40px;padding:0 16px;border-radius:10px;font-weight:600;font-size:13.5px;background:var(--s2);border:1px solid var(--line);transition:background .15s,border-color .15s,transform .1s}
.btn:hover{background:var(--s3);border-color:var(--line2)}
.btn:active{transform:scale(.98)}
.btn.primario{background:var(--grad);border:0;color:#fff;box-shadow:0 6px 20px rgba(91,140,255,.25)}
.btn.primario:hover{filter:brightness(1.1)}
.btn.vetro{background:rgba(255,255,255,.08);border-color:rgba(255,255,255,.12);backdrop-filter:blur(10px)}
.btn.vetro:hover{background:rgba(255,255,255,.14)}
.btn.pericolo{color:var(--bad)}
.btn.pericolo:hover{background:rgba(255,107,107,.1);border-color:rgba(255,107,107,.3)}
.btn-gioca{height:52px;padding:0 34px;font-size:15px;letter-spacing:.06em;border-radius:12px}
.btn-gioca.attivo{background:linear-gradient(135deg,#10b981,#059669);box-shadow:0 6px 20px rgba(16,185,129,.25)}
.icona-btn{width:40px;height:40px;display:inline-flex;align-items:center;justify-content:center;border-radius:10px;color:var(--muted);background:var(--s1);border:1px solid var(--line);transition:.15s}
.icona-btn:hover{color:var(--txt);background:var(--s2);border-color:var(--line2)}
.icona-btn.pericolo:hover{color:var(--bad);border-color:rgba(255,107,107,.35)}
[data-tip]{position:relative}
[data-tip]:hover::after{content:attr(data-tip);position:absolute;bottom:calc(100% + 8px);left:50%;transform:translateX(-50%);background:#000;color:#fff;font-size:12px;font-weight:500;padding:5px 9px;border-radius:6px;white-space:nowrap;pointer-events:none;z-index:99}

/* --- struttura --- */
.app{display:grid;grid-template-columns:var(--side-w) 1fr;height:100vh}
.trascina{-webkit-app-region:drag}
.no-trascina{-webkit-app-region:no-drag}
.barra-top{position:fixed;top:0;left:var(--side-w);right:140px;height:38px;z-index:40}

/* sidebar */
aside{background:var(--side);border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
.logo{height:64px;display:flex;align-items:center;gap:11px;padding:14px 20px 0}
.logo img{width:30px;height:30px;border-radius:8px}
.logo b{font:700 15.5px var(--font-d);letter-spacing:.01em}
.logo small{display:block;color:var(--dim);font-size:11px;font-weight:500;margin-top:-2px}
.cerca{position:relative;margin:18px 16px 10px}
.cerca svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--dim)}
.cerca input{padding-left:36px;height:38px;background:var(--s1);border-color:var(--line);font-size:13px}
.nav{padding:4px 10px}
.voce{display:flex;align-items:center;gap:11px;width:100%;padding:9px 12px;border-radius:9px;color:var(--muted);font-weight:500;text-align:left;transition:.12s}
.voce:hover{background:var(--s1);color:var(--txt)}
.voce.on{background:var(--s2);color:var(--txt)}
.etichetta{display:flex;justify-content:space-between;padding:18px 22px 8px;font-size:11px;font-weight:700;letter-spacing:.09em;color:var(--dim);text-transform:uppercase}
.lista{flex:1;overflow-y:auto;padding:0 10px 10px;min-height:0}
.lista .voce{padding:6px 10px}
.mini{width:34px;height:34px;border-radius:7px;background-size:cover;background-position:center;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;color:rgba(255,255,255,.85);flex-shrink:0}
.lista .nome{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:13.5px}
.punto{width:8px;height:8px;border-radius:50%;background:var(--ok);box-shadow:0 0 0 3px rgba(52,211,153,.18)}
.lista-vuota{color:var(--dim);font-size:13px;padding:6px 12px}
.side-piede{padding:14px 16px 18px;border-top:1px solid var(--line)}
.side-piede .btn{width:100%;justify-content:center}

/* contenuto */
.contenuto{overflow-y:auto;position:relative;min-height:0}
.vista{animation:entra .25s ease}
@keyframes entra{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

/* hero home */
.hero{position:relative;height:420px;overflow:hidden;display:flex;align-items:flex-end}
.hero-bg{position:absolute;inset:0;background-size:cover;background-position:center;transform:scale(1.02)}
.hero-bg.sfoca{filter:blur(28px) saturate(1.2);transform:scale(1.2)}
.hero::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,rgba(10,11,15,.96) 0%,rgba(10,11,15,.72) 38%,rgba(10,11,15,.15) 75%),linear-gradient(0deg,var(--bg) 0%,transparent 45%)}
.hero-c{position:relative;z-index:1;padding:0 48px 46px;max-width:720px}
.occhiello{display:inline-flex;align-items:center;gap:7px;font-size:11.5px;font-weight:700;letter-spacing:.12em;color:#aab6ff;text-transform:uppercase;margin-bottom:12px}
.hero h1{font:700 50px/1.05 var(--font-d);margin:0 0 14px;letter-spacing:-.02em;text-shadow:0 2px 24px rgba(0,0,0,.4)}
.hero .meta{display:flex;gap:18px;color:#c3c9d8;font-size:13.5px;margin-bottom:24px}
.hero .meta span{display:inline-flex;align-items:center;gap:7px}
.azioni{display:flex;gap:10px;align-items:center;flex-wrap:wrap}

/* sezione griglia */
.sezione{padding:26px 48px 48px}
.sez-testa{display:flex;align-items:center;gap:14px;margin-bottom:20px}
.sez-testa h2{font:600 19px var(--font-d);margin:0}
.conta{color:var(--dim);font-weight:500}
.segmenti{margin-left:auto;display:flex;background:var(--s1);border:1px solid var(--line);border-radius:10px;padding:3px}
.segmenti button{padding:6px 12px;border-radius:7px;color:var(--muted);font-size:12.5px;font-weight:600}
.segmenti button.on{background:var(--s3);color:var(--txt)}
.griglia{display:grid;grid-template-columns:repeat(auto-fill,minmax(178px,1fr));gap:26px 20px}
.card{cursor:pointer}
.card .cop{position:relative;aspect-ratio:3/4;border-radius:var(--r);background-size:cover;background-position:center;overflow:hidden;box-shadow:0 8px 24px rgba(0,0,0,.35);transition:transform .2s,box-shadow .2s;display:flex;align-items:center;justify-content:center}
.card .cop::before{content:"";position:absolute;inset:0;border-radius:inherit;box-shadow:inset 0 0 0 1px rgba(255,255,255,.08);z-index:2}
.card:hover .cop{transform:translateY(-5px);box-shadow:0 18px 38px rgba(0,0,0,.55),0 0 0 2px var(--acc)}
.cop .velo{position:absolute;inset:0;background:linear-gradient(0deg,rgba(0,0,0,.65),transparent 55%);opacity:0;transition:.2s;display:flex;align-items:center;justify-content:center;z-index:1}
.card:hover .velo{opacity:1}
.tondo-play{width:56px;height:56px;border-radius:50%;background:var(--grad);display:flex;align-items:center;justify-content:center;box-shadow:0 8px 24px rgba(91,140,255,.45);transform:scale(.85);transition:.2s}
.card:hover .tondo-play{transform:scale(1)}
.tondo-play:hover{filter:brightness(1.15)}
.badge{position:absolute;top:10px;left:10px;z-index:3;display:inline-flex;align-items:center;gap:6px;background:rgba(0,0,0,.7);backdrop-filter:blur(6px);padding:4px 9px;border-radius:20px;font-size:10.5px;font-weight:700;letter-spacing:.05em;color:var(--ok)}
.card .titolo{margin-top:11px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card .sotto{color:var(--dim);font-size:12.5px;margin-top:1px}
.iniz{font:700 44px var(--font-d);color:rgba(255,255,255,.9);letter-spacing:-.02em;text-shadow:0 2px 12px rgba(0,0,0,.3)}

/* vuoto */
.vuoto{height:100%;min-height:calc(100vh - 20px);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:40px}
.vuoto .cerchio{width:110px;height:110px;border-radius:28px;background:var(--grad);display:flex;align-items:center;justify-content:center;margin-bottom:28px;box-shadow:0 20px 50px rgba(91,140,255,.3)}
.vuoto h2{font:700 28px var(--font-d);margin:0 0 10px}
.vuoto p{color:var(--muted);max-width:420px;margin:0 0 26px;font-size:15px}

/* pagina gioco */
.banner{position:relative;height:clamp(380px,52vh,540px);display:flex;align-items:flex-end;overflow:hidden}
.banner::after{content:"";position:absolute;inset:0;background:linear-gradient(0deg,var(--bg) 2%,rgba(10,11,15,.55) 45%,rgba(10,11,15,.25) 100%),linear-gradient(90deg,rgba(10,11,15,.7),transparent 60%)}
.indietro{position:absolute;top:24px;left:40px;z-index:2}
.banner-c{position:relative;z-index:1;display:flex;align-items:flex-end;gap:30px;padding:0 48px 34px;width:100%}
.banner .cop{width:172px;aspect-ratio:3/4;border-radius:14px;background-size:cover;background-position:center;box-shadow:0 24px 50px rgba(0,0,0,.6),0 0 0 1px rgba(255,255,255,.1);flex-shrink:0;display:flex;align-items:center;justify-content:center}
.banner h1{font:700 54px/1.02 var(--font-d);margin:0 0 14px;letter-spacing:-.025em;text-shadow:0 2px 30px rgba(0,0,0,.5)}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;gap:6px;padding:5px 11px;border-radius:20px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.1);backdrop-filter:blur(8px);font-size:12.5px;color:#d3d8e4}
.chip.ok{color:var(--ok);border-color:rgba(52,211,153,.3)}

.barra-azioni{display:flex;align-items:center;gap:28px;padding:18px 20px;margin:0 48px;background:var(--s1);border:1px solid var(--line);border-radius:16px}
.stat small{display:block;color:var(--dim);font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;margin-bottom:2px}
.stat b{font-weight:600;font-size:14.5px}
.divisore{width:1px;height:34px;background:var(--line2)}
.barra-azioni .dx{margin-left:auto;display:flex;gap:8px}

.corpo{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:32px;padding:32px 48px 56px}
.corpo h3{font:600 16px var(--font-d);margin:0 0 14px;display:flex;align-items:center;gap:9px}
.viewer{aspect-ratio:16/9;border-radius:14px;background:#000 center/contain no-repeat;border:1px solid var(--line);cursor:zoom-in;position:relative;overflow:hidden}
.viewer .freccia{position:absolute;top:50%;transform:translateY(-50%);width:42px;height:42px;border-radius:50%;background:rgba(0,0,0,.55);backdrop-filter:blur(6px);display:flex;align-items:center;justify-content:center;opacity:0;transition:.2s}
.viewer:hover .freccia{opacity:1}
.viewer .freccia:hover{background:rgba(0,0,0,.8)}
.striscia{display:flex;gap:10px;margin-top:12px;overflow-x:auto;padding-bottom:4px}
.striscia div{width:132px;aspect-ratio:16/9;flex-shrink:0;border-radius:8px;background:center/cover;cursor:pointer;opacity:.5;transition:.15s;box-shadow:inset 0 0 0 1px var(--line)}
.striscia div:hover{opacity:.85}
.striscia div.on{opacity:1;box-shadow:0 0 0 2px var(--acc)}
.nessuna-foto{aspect-ratio:16/9;border-radius:14px;border:1.5px dashed var(--line2);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;color:var(--muted)}
.descr{color:#c3c9d8;line-height:1.65;white-space:pre-wrap;margin-top:34px;user-select:text}
.descr.vuota{color:var(--dim);font-style:italic}
.pannello{background:var(--s1);border:1px solid var(--line);border-radius:16px;padding:20px}
.riga-det{display:flex;justify-content:space-between;gap:12px;padding:11px 0;border-bottom:1px solid var(--line);font-size:13px}
.riga-det:last-child{border:0;padding-bottom:0}
.riga-det span{color:var(--muted);display:inline-flex;align-items:center;gap:8px}
.riga-det b{font-weight:600;text-align:right;word-break:break-all}
.consiglio{margin-top:16px;padding:14px;border-radius:12px;background:rgba(91,140,255,.08);border:1px solid rgba(91,140,255,.2);color:#b8c6ff;font-size:12.5px;display:flex;gap:10px}
kbd{font:600 11px var(--font);background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.15);border-bottom-width:2px;border-radius:5px;padding:1px 6px;color:#fff}

/* modale */
.velo-mod{position:fixed;inset:0;background:rgba(4,5,8,.72);backdrop-filter:blur(6px);display:flex;align-items:center;justify-content:center;z-index:60;padding:24px;animation:sfuma .15s}
@keyframes sfuma{from{opacity:0}}
.mod{background:var(--s1);border:1px solid var(--line2);border-radius:20px;width:min(820px,100%);max-height:calc(100vh - 48px);display:flex;flex-direction:column;box-shadow:0 30px 80px rgba(0,0,0,.6);animation:sale .2s ease}
@keyframes sale{from{opacity:0;transform:translateY(12px) scale(.98)}}
.mod-testa{display:flex;align-items:flex-start;gap:14px;padding:24px 26px 6px}
.mod-testa h2{font:700 21px var(--font-d);margin:0}
.mod-testa p{color:var(--muted);margin:4px 0 0;font-size:13.5px}
.mod-testa .icona-btn{margin-left:auto;background:transparent;border-color:transparent}
.mod-corpo{padding:18px 26px;overflow-y:auto}
.mod-piede{display:flex;justify-content:flex-end;gap:10px;padding:16px 26px 22px;border-top:1px solid var(--line)}
.drop{border:1.5px dashed var(--line2);border-radius:16px;padding:44px 24px;text-align:center;transition:.15s;background:var(--bg)}
.drop.sopra{border-color:var(--acc);background:rgba(91,140,255,.07)}
.drop .ic{width:60px;height:60px;border-radius:16px;margin:0 auto 16px;background:rgba(91,140,255,.12);color:var(--acc);display:flex;align-items:center;justify-content:center}
.drop h4{margin:0 0 6px;font-size:16px}
.drop p{color:var(--muted);margin:0 0 20px;font-size:13.5px}
.drop .azioni{justify-content:center}
.sorgente{display:flex;align-items:center;gap:14px;background:var(--bg);border:1px solid var(--line);border-radius:14px;padding:14px 16px}
.sorgente .ic{width:42px;height:42px;border-radius:11px;background:rgba(52,211,153,.12);color:var(--ok);display:flex;align-items:center;justify-content:center}
.sorgente .info{flex:1;min-width:0}
.sorgente .info b{display:block;font-size:13.5px}
.sorgente .info span{display:block;color:var(--dim);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;user-select:text}
.sorgente select{margin-top:8px;padding:7px 10px;font-size:12.5px}
.form{display:grid;grid-template-columns:180px 1fr;gap:24px;margin-top:22px}
.campo label{display:block;font-size:12px;font-weight:600;color:var(--muted);margin:0 0 7px}
.campo + .campo{margin-top:16px}
.scegli-cop{aspect-ratio:3/4;border-radius:14px;border:1.5px dashed var(--line2);background:var(--bg) center/cover no-repeat;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;color:var(--dim);cursor:pointer;font-size:12.5px;text-align:center;padding:12px;transition:.15s;position:relative}
.scegli-cop:hover{border-color:var(--acc);color:var(--muted)}
.scegli-cop.piena{border:0;box-shadow:0 0 0 1px var(--line2)}
.scegli-cop.piena > *{display:none}
.scegli-cop.piena::after{content:"Cambia";position:absolute;bottom:10px;left:50%;transform:translateX(-50%);background:rgba(0,0,0,.7);padding:4px 12px;border-radius:20px;font-size:12px;color:#fff;opacity:0;transition:.15s}
.scegli-cop.piena:hover::after{opacity:1}
.foto-griglia{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px}
.foto{position:relative;aspect-ratio:16/9;border-radius:10px;background:var(--bg) center/cover;box-shadow:inset 0 0 0 1px var(--line)}
.foto .togli{position:absolute;top:6px;right:6px;width:26px;height:26px;border-radius:50%;background:rgba(0,0,0,.75);display:flex;align-items:center;justify-content:center;opacity:0;transition:.15s}
.foto:hover .togli{opacity:1}
.foto.agg{border:1.5px dashed var(--line2);box-shadow:none;display:flex;align-items:center;justify-content:center;gap:6px;color:var(--dim);cursor:pointer;font-size:12.5px;transition:.15s}
.foto.agg:hover{border-color:var(--acc);color:var(--muted)}
.errore{display:flex;align-items:center;gap:8px;color:var(--bad);font-size:13px;margin-top:14px}
.errore:empty{display:none}
.nascosto{display:none!important}
.attesa{opacity:.55;pointer-events:none}
.conferma{width:min(440px,100%)}
.conferma .mod-corpo{color:var(--muted)}

/* pagina sincronizzazione */
.pagina{max-width:860px;padding:44px 48px 60px}
.pagina h1{font:700 32px var(--font-d);margin:0 0 6px;letter-spacing:-.01em}
.pagina .sub2{color:var(--muted);margin:0 0 28px;font-size:15px}
.card-imp{background:var(--s1);border:1px solid var(--line);border-radius:16px;padding:24px;margin-bottom:16px}
.card-imp h3{font:600 17px var(--font-d);margin:0 0 6px}
.card-imp p{color:var(--muted);margin:0 0 4px}
.riga-imp{display:flex;gap:18px;align-items:flex-start}
.ic-imp{width:52px;height:52px;border-radius:14px;background:var(--s3);color:var(--muted);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.ic-imp.ok{background:rgba(52,211,153,.13);color:var(--ok)}
.card-imp code{display:inline-block;margin-top:10px;font:12.5px Consolas,monospace;color:#aeb6c8;background:var(--bg);border:1px solid var(--line);padding:6px 10px;border-radius:8px;word-break:break-all;user-select:text}
.passi-num{margin:12px 0 0;padding-left:22px;color:#c3c9d8;line-height:1.9}
.nota{display:flex;gap:10px;color:var(--dim);font-size:13px;margin-top:20px}
.stato-sync{display:flex;align-items:center;gap:8px;width:100%;padding:8px 10px;margin-bottom:10px;border-radius:9px;color:var(--dim);font-size:12.5px;font-weight:500}
.stato-sync:hover{background:var(--s1);color:var(--muted)}
.stato-sync.ok{color:var(--ok)}

.interr{display:flex;gap:14px;align-items:flex-start;margin-top:16px;cursor:pointer}
.interr input{display:none}
.interr .slider{width:42px;height:24px;border-radius:12px;background:var(--s3);position:relative;flex-shrink:0;transition:.2s;margin-top:2px}
.interr .slider::after{content:"";position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:#fff;transition:.2s}
.interr input:checked + .slider{background:var(--acc)}
.interr input:checked + .slider::after{left:21px}
.interr b{display:block;font-weight:600}
.interr small{display:block;color:var(--muted);font-size:12.5px;margin-top:2px}
.avviso{display:flex;gap:10px;margin-top:14px;padding:12px 14px;border-radius:12px;background:rgba(255,107,107,.08);border:1px solid rgba(255,107,107,.25);color:#ffb4b4;font-size:13px}
.gpu-ok{display:flex;gap:12px;align-items:center;margin-top:10px}
.gpu-ok b{font-size:15px}

.avviso-an{display:flex;gap:11px;margin:18px 0 4px;padding:12px 14px;border-radius:12px;background:rgba(255,77,77,.12);border:1px solid rgba(255,77,77,.45);color:#ffc2c2;font-size:13px;line-height:1.45;animation:pulsaRosso 2.4s ease-in-out infinite}
.avviso-an svg{color:#ff5c5c;margin-top:1px}
.avviso-an b{color:#ff8a8a;font-weight:700}
.avviso-an ul{margin:4px 0 0;padding-left:18px}
.avviso-an li{margin:1px 0}
@keyframes pulsaRosso{0%,100%{box-shadow:0 0 0 0 rgba(255,77,77,0)}50%{box-shadow:0 0 0 4px rgba(255,77,77,.12)}}

/* assistente */
.chat{max-width:880px;display:flex;flex-direction:column;min-height:100vh;padding-bottom:18px}
.chat-testa{display:flex;justify-content:space-between;align-items:flex-start;gap:16px}
.chat-testa .sub2{display:flex;align-items:center;gap:6px;margin-bottom:22px}
.chat-testa .azioni{display:flex;gap:10px}
.messaggi{flex:1;display:flex;flex-direction:column;gap:18px;padding-bottom:20px}
.msg{display:flex;gap:12px;align-items:flex-start}
.msg.utente{justify-content:flex-end}
.msg .bolla{max-width:min(680px,88%);padding:13px 16px;border-radius:16px;line-height:1.6;user-select:text;font-size:14.5px}
.msg.utente .bolla{background:var(--grad);color:#fff;border-bottom-right-radius:5px}
.msg.ia .bolla{background:var(--s1);border:1px solid var(--line);border-top-left-radius:5px}
.av-ia{width:32px;height:32px;border-radius:10px;background:var(--grad);color:#fff;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.av-ia.grande{width:64px;height:64px;border-radius:20px;margin:0 auto 14px}
.md p{margin:0}.md h4{margin:6px 0 2px;font:600 15.5px var(--font-d)}.md ul,.md ol{margin:2px 0;padding-left:22px}.md li{margin:2px 0}
.md .spazio{height:10px}.md code{font:12.5px Consolas,monospace;background:var(--bg);padding:1px 6px;border-radius:5px}
.bolla a{color:#9db8ff;cursor:pointer;text-decoration:underline;text-underline-offset:2px}
.cercato{display:flex;align-items:center;gap:6px;flex-wrap:wrap;color:var(--dim);font-size:12.5px;margin-bottom:8px}
.cercato a{color:var(--muted)}
.fonti{display:flex;flex-wrap:wrap;gap:7px;margin-top:14px;padding-top:12px;border-top:1px solid var(--line)}
.fonti small{width:100%;font-size:11px;font-weight:700;letter-spacing:.09em;color:var(--dim);text-transform:uppercase}
.bolla a.fonte{display:inline-flex;align-items:center;gap:7px;max-width:100%;padding:5px 10px 5px 6px;border-radius:9px;background:var(--s2);border:1px solid var(--line);color:var(--txt);text-decoration:none;font-size:12.5px}
.bolla a.fonte:hover{border-color:var(--acc)}
.fonte .n{width:18px;height:18px;border-radius:6px;background:var(--s3);font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.fonte em{color:var(--dim);font-style:normal}
.senza{display:flex;gap:6px;align-items:flex-start;color:#f5c97a;font-size:12.5px;margin-top:12px}
.senza svg{margin-top:3px}
.pensa{display:flex;align-items:center;gap:10px;color:var(--muted)}
.errore-ia{display:flex;gap:10px;color:#ffb4b4}.errore-ia svg{margin-top:3px}
.benvenuto{text-align:center;margin:auto 0;padding:30px 0}
.benvenuto h2{font:700 24px var(--font-d);margin:0 0 6px}.benvenuto p{color:var(--muted);margin:0 0 22px}
.esempi{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px;text-align:left}
.esempio{padding:13px 15px;border-radius:12px;background:var(--s1);border:1px solid var(--line);color:var(--muted);transition:.15s}
.esempio:hover{border-color:var(--line2);color:var(--txt);background:var(--s2)}
.scrivi{position:sticky;bottom:12px;display:flex;gap:10px;align-items:flex-end;padding:10px;border-radius:16px;background:rgba(20,23,31,.92);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border:1px solid var(--line2);box-shadow:0 10px 40px rgba(0,0,0,.45)}
.scrivi textarea{min-height:44px;max-height:180px;resize:none;border:0;background:transparent;box-shadow:none;padding:11px 8px}
.scrivi .invia{width:44px;height:44px;padding:0;justify-content:center;flex-shrink:0}
.scrivi .invia:disabled,.scrivi textarea:disabled{opacity:.5}
.avvertenza{text-align:center;color:var(--dim);font-size:11.5px;margin-top:20px}
.scelta-ia{display:flex;width:100%}.scelta-ia button{flex:1}
.nota-ia{color:var(--muted);font-size:13px;line-height:1.55;margin:12px 0 0}
.nota-ia svg{vertical-align:-2px}
.nota-ia+.lab-ia,.lab-ia{display:block;margin:18px 0 8px;font-size:13px;color:var(--muted)}
.riga-chiave{display:flex;gap:8px}.riga-chiave input{font-family:Consolas,monospace}
.passi-num a{color:#9db8ff;cursor:pointer;text-decoration:underline}

/* profili */
.avatar{width:44px;height:44px;border-radius:50%;display:flex;align-items:center;justify-content:center;font:700 16px var(--font-d);color:#fff;flex-shrink:0;box-shadow:inset 0 0 0 2px rgba(255,255,255,.12)}
.avatar.grande{width:76px;height:76px;font-size:26px}
.griglia-profili{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:16px}
.card-profilo{background:var(--s1);border:1px solid var(--line);border-radius:16px;padding:22px 18px 16px;display:flex;flex-direction:column;align-items:center;text-align:center;gap:8px}
.card-profilo b{font:600 16px var(--font-d);margin-top:6px;word-break:break-word}
.card-profilo small{color:var(--dim);font-size:12.5px}

.card-profilo .azioni-p{display:flex;gap:6px;margin-top:auto;padding-top:10px}
.card-profilo.nuovo{border:1.5px dashed var(--line2);background:transparent;color:var(--muted);justify-content:center;min-height:200px;cursor:pointer;font-weight:600;transition:.15s}
.card-profilo.nuovo:hover{border-color:var(--acc);color:var(--txt)}
.card-profilo.nuovo .piu{width:56px;height:56px;border-radius:50%;background:rgba(91,140,255,.12);color:var(--acc);display:flex;align-items:center;justify-content:center;margin-bottom:6px}
.scelta-profili{display:flex;flex-wrap:wrap;gap:14px;justify-content:center;padding:6px 0 4px}
.tile-profilo{display:flex;flex-direction:column;align-items:center;gap:9px;width:112px;padding:14px 6px 12px;border-radius:16px;border:2px solid transparent;color:var(--muted);font-weight:600;transition:.15s}
.tile-profilo:hover{background:var(--s2);color:var(--txt)}
.tile-profilo.on{border-color:var(--acc);background:rgba(91,140,255,.08);color:var(--txt)}
.tile-profilo span{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.campo-pw{margin-top:18px;padding-top:18px;border-top:1px solid var(--line)}
.campo-pw label{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted);margin-bottom:8px}
.pw{position:relative}
.pw input{padding-right:46px;height:46px;font-size:15px}
.pw button{position:absolute;right:6px;top:50%;transform:translateY(-50%);width:36px;height:36px;border-radius:8px;color:var(--dim);display:flex;align-items:center;justify-content:center}
.pw button:hover{color:var(--txt)}
.scuoti{animation:scuoti .35s}
@keyframes scuoti{20%,60%{transform:translateX(-7px)}40%,80%{transform:translateX(7px)}}
.mod-piede.sx{justify-content:space-between;flex-wrap:wrap}
.spunta{display:flex;gap:10px;align-items:flex-start;margin-top:16px;font-size:13.5px;color:#c3c9d8;cursor:pointer}
.spunta input{width:18px;height:18px;margin:1px 0 0;accent-color:var(--acc);flex-shrink:0}

/* analisi automatica */
.an-testa{display:flex;gap:20px;align-items:center;margin-bottom:22px}
.an-cop{width:96px;aspect-ratio:3/4;border-radius:12px;background:var(--bg) center/cover;flex-shrink:0;position:relative;overflow:hidden;box-shadow:0 0 0 1px var(--line2)}
.an-cop.vuota::after{content:"";position:absolute;inset:0;background:linear-gradient(110deg,transparent 30%,rgba(255,255,255,.07) 50%,transparent 70%);background-size:200% 100%;animation:luccica 1.4s linear infinite}
@keyframes luccica{from{background-position:200% 0}to{background-position:-200% 0}}
.an-testa h3{font:700 24px var(--font-d);margin:2px 0 10px}
.passi{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:2px}
.passi li{display:flex;align-items:flex-start;gap:12px;padding:10px 12px;border-radius:10px;color:var(--dim);transition:.2s}
.passi li.corso{background:rgba(91,140,255,.08);color:var(--txt)}
.passi li.fatto{color:var(--muted)}
.passi .stato{width:22px;height:22px;border-radius:50%;border:2px solid var(--s3);flex-shrink:0;display:flex;align-items:center;justify-content:center}
.passi li.corso .stato{border-color:rgba(255,255,255,.15);border-top-color:var(--acc);animation:gira .8s linear infinite}
.passi li.fatto .stato{border:0;background:rgba(52,211,153,.15);color:var(--ok)}
.passi b{font-weight:600;display:block}
.passi small{display:block;font-size:12px;color:var(--dim);margin-top:2px}
.passi li.corso small{color:#a9b8ff}
.an-foto{margin-top:16px;display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:10px}
.an-foto .foto{animation:sale .3s ease}
.tags{display:flex;flex-wrap:wrap;gap:6px;justify-content:flex-end}
.tag{font-size:11.5px;font-weight:600;padding:3px 8px;border-radius:6px;background:var(--s2);border:1px solid var(--line);color:#c9cfdc}

/* overlay trascinamento */
.zona-drop{position:fixed;inset:0;z-index:70;background:rgba(10,11,15,.85);backdrop-filter:blur(8px);display:flex;align-items:center;justify-content:center;pointer-events:none;opacity:0;transition:opacity .15s}
.zona-drop.on{opacity:1}
.zona-drop div{border:2px dashed var(--acc);border-radius:24px;padding:60px 90px;text-align:center}
.zona-drop h2{font:700 24px var(--font-d);margin:16px 0 6px}
.zona-drop p{color:var(--muted);margin:0}

/* lightbox e toast */
.lightbox{position:fixed;inset:0;z-index:80;background:rgba(0,0,0,.94);display:flex;align-items:center;justify-content:center;animation:sfuma .15s}
.lightbox img{max-width:90vw;max-height:86vh;border-radius:10px;box-shadow:0 30px 80px rgba(0,0,0,.6)}
.lightbox .freccia,.lightbox .chiudi{position:absolute;width:48px;height:48px;border-radius:50%;background:rgba(255,255,255,.08);display:flex;align-items:center;justify-content:center}
.lightbox .freccia:hover,.lightbox .chiudi:hover{background:rgba(255,255,255,.16)}
.lightbox .chiudi{top:50px;right:30px}
.lightbox .conta-lb{position:absolute;bottom:28px;color:var(--muted);font-size:13px}
.toasts{position:fixed;right:24px;bottom:24px;z-index:90;display:flex;flex-direction:column;gap:10px}
.toast{display:flex;align-items:center;gap:10px;background:var(--s2);border:1px solid var(--line2);padding:12px 16px;border-radius:12px;box-shadow:0 12px 30px rgba(0,0,0,.4);font-weight:500;animation:sale .2s}
.toast svg{color:var(--ok)}
.toast.err svg{color:var(--bad)}
.giro{width:16px;height:16px;border-radius:50%;border:2px solid rgba(255,255,255,.2);border-top-color:var(--acc);animation:gira .8s linear infinite}
@keyframes gira{to{transform:rotate(360deg)}}
</style>

<script>
/* ===== AstroLauncher (versione HTML) — sostituisce le funzioni del programma Windows =====
   Libreria salvata in IndexedDB del browser; i giochi si aprono in una nuova scheda. */
(() => {
  const DB = 'AstroLauncherWeb', ST = 'giochi';
  let dbp;
  const db = () => dbp || (dbp = new Promise((ok, ko) => {
    const r = indexedDB.open(DB, 1);
    r.onupgradeneeded = () => r.result.createObjectStore(ST, { keyPath: 'id' });
    r.onsuccess = () => ok(r.result); r.onerror = () => ko(r.error);
  }));
  const tx = async (mode, fn) => {
    const d = await db();
    return new Promise((ok, ko) => {
      const t = d.transaction(ST, mode); const s = t.objectStore(ST); let out;
      const rq = fn(s); if (rq) rq.onsuccess = () => { out = rq.result; };
      t.oncomplete = () => ok(out); t.onerror = () => ko(t.error); t.onabort = () => ko(t.error);
    });
  };
  const tutti = () => tx('readonly', (s) => s.getAll());
  const uno = (id) => tx('readonly', (s) => s.get(id));
  const salva = (g) => tx('readwrite', (s) => s.put(g));

  const MIME = { html: 'text/html', htm: 'text/html', js: 'text/javascript', mjs: 'text/javascript', css: 'text/css', json: 'application/json', png: 'image/png', jpg: 'image/jpeg', jpeg: 'image/jpeg', gif: 'image/gif', webp: 'image/webp', svg: 'image/svg+xml', avif: 'image/avif', ico: 'image/x-icon', mp3: 'audio/mpeg', ogg: 'audio/ogg', wav: 'audio/wav', m4a: 'audio/mp4', mp4: 'video/mp4', webm: 'video/webm', wasm: 'application/wasm', woff: 'font/woff', woff2: 'font/woff2', ttf: 'font/ttf', otf: 'font/otf', txt: 'text/plain', xml: 'application/xml' };
  const ext = (n) => (n.split('.').pop() || '').toLowerCase();
  const tipoMime = (n) => MIME[ext(n)] || 'application/octet-stream';
  const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
  const unb64 = (s) => { const b = atob(s), u = new Uint8Array(b.length); for (let i = 0; i < b.length; i++) u[i] = b.charCodeAt(i); return u; };
  const aDataUrl = (blob) => new Promise((ok, ko) => { const r = new FileReader(); r.onload = () => ok(r.result); r.onerror = () => ko(r.error); r.readAsDataURL(blob); });
  const daDataUrl = async (u) => (await fetch(u)).blob();

  /* ---- file temporanei (gioco in fase di aggiunta, immagini scelte) ---- */
  const staged = {}; // radice -> { rel: Blob }
  const tmpImg = {}; // path -> Blob
  let nStage = 0;
  const nuovaImg = (blob, nome) => { const path = 'img:' + uid(); tmpImg[path] = blob; return { path, url: URL.createObjectURL(blob), nome }; };

  /* ---- URL degli oggetti di libreria ---- */
  const urlCache = new WeakMap();
  const urlDi = (b) => { if (!b) return null; let u = urlCache.get(b); if (!u) { u = URL.createObjectURL(b); urlCache.set(b, u); } return u; };

  const inCorso = {}; // id -> { win, t0 }

  function vista(g) {
    return {
      id: g.id, nome: g.nome, descrizione: g.descrizione || '', tipo: g.tipo, entry: g.entry,
      copertina: g.copertina ? 'cop' : '', copertinaAuto: !!g.copertinaAuto, copertinaUrl: urlDi(g.copertina),
      foto: (g.foto || []).map((f) => f.rel), fotoUrl: (g.foto || []).map((f) => ({ rel: f.rel, url: urlDi(f.blob) })),
      tecnologie: g.tecnologie || [], comandi: g.comandi || [], numFile: g.numFile || 0, dimensione: g.dimensione || 0,
      aggiunto: g.aggiunto, ultimaVolta: g.ultimaVolta || 0, tempo: g.tempo || 0, partite: g.partite || 0,
      profili: [], inEsecuzione: !!(inCorso[g.id] && inCorso[g.id].win && !inCorso[g.id].win.closed),
    };
  }
  const notifica = () => { try { window.__aggiornato && window.__aggiornato(); } catch (e) {} };

  /* ---- analisi dei file ---- */
  const testo = async (b) => { try { return await b.text(); } catch (e) { return ''; } };
  function htmlDi(files) { return Object.keys(files).filter((n) => /\.html?$/i.test(n)); }
  function scegliEntry(lista) {
    const p = (n) => n.split('/').length;
    const idx = lista.filter((n) => /(^|\/)index\.html?$/i.test(n)).sort((a, b) => p(a) - p(b))[0];
    return idx || lista.sort((a, b) => p(a) - p(b))[0];
  }
  function pulisciNome(n) {
    return n.replace(/\.html?$/i, '').replace(/[_\-.]+/g, ' ').replace(/\s+/g, ' ').trim().replace(/\b\w/g, (c) => c.toUpperCase());
  }
  async function leggiInfo(files, entry, nomeSorgente) {
    const nomi = Object.keys(files);
    const dimensione = nomi.reduce((a, n) => a + files[n].size, 0);
    const h = await testo(files[entry] || new Blob([]));
    let js = h;
    for (const n of nomi) if (/\.m?js$/i.test(n) && files[n].size < 3e6) js += '\n' + (await testo(files[n]));
    const meta = (re) => { const m = h.match(re); return m ? m[1].replace(/\s+/g, ' ').trim() : ''; };
    const nome = meta(/<meta[^>]+property=["']og:title["'][^>]+content=["']([^"']+)/i) || meta(/<title[^>]*>([^<]+)</i) || pulisciNome(nomeSorgente);
    const descrizione = meta(/<meta[^>]+name=["']description["'][^>]+content=["']([^"']+)/i) || meta(/<meta[^>]+property=["']og:description["'][^>]+content=["']([^"']+)/i);
    const tec = [];
    const T = [['Phaser', /phaser/i], ['Three.js', /three(\.min)?\.js|THREE\./], ['Babylon.js', /babylon/i], ['PixiJS', /pixi(\.min)?\.js|PIXI\./], ['Unity WebGL', /unityloader|createunityinstance|unity webgl/i], ['Godot', /godot/i], ['WebGL', /getContext\(\s*["'](webgl2?|experimental-webgl)/i], ['Canvas 2D', /getContext\(\s*["']2d["']/i], ['WebAssembly', /\.wasm|WebAssembly/]];
    for (const [n, re] of T) if (re.test(js) || re.test(nomi.join(' '))) tec.push(n);
    if (!tec.length) tec.push('HTML5');
    const com = [];
    if (/ArrowLeft|ArrowUp|keyCode\s*={2,3}\s*3[7-9]|keyCode\s*={2,3}\s*40/.test(js)) com.push('Frecce');
    if (/["'`]KeyW["'`]|["'`]w["'`]|keyCode\s*={2,3}\s*87/.test(js)) com.push('WASD');
    if (/["'`]Space["'`]|["'`] ["'`]|keyCode\s*={2,3}\s*32/.test(js)) com.push('Spazio');
    if (/mousedown|mousemove|onclick|pointerdown|addEventListener\(\s*["']click/.test(js)) com.push('Mouse');
    if (/touchstart|touchmove|pointerdown/.test(js)) com.push('Touch');
    if (/getGamepads/.test(js)) com.push('Gamepad');
    return { nome, descrizione, tecnologie: tec.slice(0, 4), comandi: com, numFile: nomi.length, dimensione, fotoTrovate: [], copertina: null };
  }

  /* ---- cattura di foto (best effort: solo giochi che disegnano su <canvas>) ---- */
  async function scatta(files, entry, suFoto, annullato) {
    const out = [];
    let fr;
    try {
      const { html } = await preparaPagina(files, entry);
      fr = document.createElement('iframe');
      fr.setAttribute('sandbox', 'allow-scripts allow-same-origin');
      fr.style.cssText = 'position:fixed;left:-12000px;top:0;width:960px;height:540px;border:0;pointer-events:none';
      fr.srcdoc = html; document.body.appendChild(fr);
      for (let i = 0; i < 3 && !annullato(); i++) {
        await new Promise((r) => setTimeout(r, i ? 1800 : 3000));
        try {
          const doc = fr.contentDocument, win = fr.contentWindow;
          const cs = [...doc.querySelectorAll('canvas')].filter((c) => c.width > 64 && c.height > 64).sort((a, b) => b.width * b.height - a.width * a.height);
          if (!cs.length) break;
          const c = await new Promise((ok) => win.requestAnimationFrame(() => {
            try {
              const o = document.createElement('canvas'); o.width = 960; o.height = 540;
              const x = o.getContext('2d'); x.fillStyle = '#000'; x.fillRect(0, 0, 960, 540);
              const s = cs[0]; const k = Math.max(960 / s.width, 540 / s.height);
              x.drawImage(s, (960 - s.width * k) / 2, (540 - s.height * k) / 2, s.width * k, s.height * k);
              const d = x.getImageData(0, 0, 960, 540).data; let m = 0;
              for (let j = 0; j < d.length; j += 4 * 997) m += d[j] + d[j + 1] + d[j + 2];
              ok(m > 400 ? o : null);
            } catch (e) { ok(null); }
          }));
          if (!c) continue;
          const blob = await new Promise((ok) => c.toBlob(ok, 'image/jpeg', 0.88));
          if (blob) { const im = nuovaImg(blob, 'foto.jpg'); out.push(im); suFoto(im); }
        } catch (e) { break; }
      }
    } catch (e) { /* nessuna foto */ }
    if (fr) fr.remove();
    return out;
  }

  /* ---- costruzione della pagina del gioco (riscrive i percorsi dei file locali) ---- */
  const norm = (base, rel) => {
    if (/^([a-z]+:|\/\/|#|data:)/i.test(rel)) return null;
    rel = rel.split('#')[0].split('?')[0]; try { rel = decodeURIComponent(rel); } catch (e) {}
    const parti = (rel.startsWith('/') ? rel.slice(1) : (base ? base + '/' : '') + rel).split('/'); const out = [];
    for (const p of parti) { if (p === '..') out.pop(); else if (p && p !== '.') out.push(p); }
    return out.join('/');
  };
  async function preparaPagina(files, entry) {
    /* Tutto viene incorporato nella pagina (CSS e JS inline, immagini/audio come data:),
       perché da file:// il browser non permette di caricare risorse blob: separate. */
    const mappa = {}, cssT = {}, jsT = {};
    const nomi = Object.keys(files);
    for (const n of nomi) if (!/\.(css|m?js|html?)$/i.test(n)) mappa[n] = await aDataUrl(new Blob([files[n]], { type: tipoMime(n) }));
    const riscrivi = (src, base) => src

  send:'<path d="M14.54 21.69a.5.5 0 0 0 .94-.03l6.5-19a.5.5 0 0 0-.64-.64l-19 6.5a.5.5 0 0 0-.03.94l7.93 3.18a2 2 0 0 1 1.11 1.11z"/><path d="m21.85 2.15-10.94 10.94"/>',

};
const I = (n, s = 18, w = 2) => `<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="${w}" stroke-linecap="round" stroke-linejoin="round">${P[n]}</svg>`;

/* ---------- utilità ---------- */
const $ = (s, el = document) => el.querySelector(s);
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));
const bg = (u) => (u ? `background-image:url(&quot;${u}&quot;)` : '');
function tinta(nome) { let h = 0; for (const c of nome) h = (h * 31 + c.charCodeAt(0)) % 360; return h; }
function sfondoFinto(nome) { const h = tinta(nome); return `background:linear-gradient(150deg,hsl(${h} 55% 34%),hsl(${(h + 45) % 360} 60% 14%))`; }
function iniziali(nome) { return nome.split(/\s+/).filter(Boolean).slice(0, 2).map((p) => p[0]).join('').toUpperCase(); }
function copertina(g, cls, extra = '') {
  return `<div class="${cls}" style="${g.copertinaUrl ? bg(g.copertinaUrl) : sfondoFinto(g.nome)}">${g.copertinaUrl ? '' : `<span class="iniz">${esc(iniziali(g.nome))}</span>`}${extra}</div>`;
}
function durata(s) {
  if (!s) return 'Mai giocato';
  const h = Math.floor(s / 3600), m = Math.round((s % 3600) / 60);
  if (h) return `${h} h${m ? ' ' + m + ' min' : ''}`;
  return `${Math.max(1, m)} min`;
}
function quando(ts) {
  if (!ts) return 'Mai';
  const d = new Date(ts), oggi = new Date(); oggi.setHours(0, 0, 0, 0);
  const giorni = Math.round((oggi - new Date(d).setHours(0, 0, 0, 0)) / 864e5);
  if (giorni <= 0) return 'Oggi'; if (giorni === 1) return 'Ieri'; if (giorni < 7) return `${giorni} giorni fa`;
  return d.toLocaleDateString('it-IT', { day: 'numeric', month: 'short', year: 'numeric' });
}
const peso = (b) => b > 1048576 ? (b / 1048576).toFixed(1).replace('.', ',') + ' MB' : Math.max(1, Math.round(b / 1024)) + ' KB';
const dataLunga = (ts) => new Date(ts).toLocaleDateString('it-IT', { day: 'numeric', month: 'long', year: 'numeric' });
function toast(msg, err, fisso) {
  const t = document.createElement('div'); t.className = 'toast' + (err ? ' err' : '');
  t.innerHTML = (fisso ? '<span class="giro"></span>' : I(err ? 'alert' : 'check', 18)) + `<span>${esc(msg)}</span>`;
  $('#toasts').appendChild(t);
  if (!fisso) setTimeout(() => { t.style.transition = '.3s'; t.style.opacity = 0; setTimeout(() => t.remove(), 300); }, 2600);
  return t;
}

/* ---------- stato ---------- */
let giochi = [];
let vista = { tipo: 'home' };
let ordine = 'recenti';
let fotoSel = 0;

async function ricarica() {
  giochi = await api.lista(); disegna();
}
api.onAggiornato(ricarica);

function filtrati() {
  const q = $('#cerca').value.trim().toLowerCase();
  const l = giochi.filter((g) => g.nome.toLowerCase().includes(q));
  const ord = {
    recenti: (a, b) => (b.ultimaVolta || b.aggiunto) - (a.ultimaVolta || a.aggiunto),
    nome: (a, b) => a.nome.localeCompare(b.nome, 'it'),
    aggiunti: (a, b) => b.aggiunto - a.aggiunto,
  };
  return l.sort(ord[ordine]);
}

function vai(v) { vista = v; fotoSel = 0; disegna(); $('#app').scrollTop = 0; }

function disegna() {
  disegnaSidebar();
  if (vista.tipo === 'sync') return disegnaSync();
  if (vista.tipo === 'profili') return disegnaProfili();
  if (vista.tipo === 'ia') { if (!$('#app .chat')) disegnaIA(); return; } // non cancella quello che stai scrivendo
  if (vista.tipo === 'gioco') {
    const g = giochi.find((x) => x.id === vista.id);
    if (g) return disegnaGioco(g);
    vista = { tipo: 'home' };
  }
  disegnaHome();
}

function disegnaSidebar() {
  $('#navHome').className = 'voce' + (vista.tipo === 'home' ? ' on' : '');
  $('#navSync').className = 'voce' + (vista.tipo === 'sync' ? ' on' : '');
  $('#navProfili').className = 'voce' + (vista.tipo === 'profili' ? ' on' : '');
  $('#navIA').className = 'voce' + (vista.tipo === 'ia' ? ' on' : '');
  $('#contaSide').textContent = giochi.length || '';

  $('#lista').innerHTML = l.length ? l.map((g) => `
    <button class="voce${vista.id === g.id ? ' on' : ''}" data-id="${g.id}">
      <div class="mini" style="${g.copertinaUrl ? bg(g.copertinaUrl) : sfondoFinto(g.nome)}">${g.copertinaUrl ? '' : esc(iniziali(g.nome))}</div>

function bottoneGioca(g) {
  return g.inEsecuzione
    ? `<button class="btn primario btn-gioca attivo" data-avvia>${I('check', 18, 2.6)} IN ESECUZIONE</button>`
    : `<button class="btn primario btn-gioca" data-avvia>${I('play', 18)} GIOCA</button>`;
}

async function avvia(id) {
  const g = giochi.find((x) => x.id === id);
  if (!g) return;
  if (g.inEsecuzione) { await glAvvia(id, '', ''); return; } // è già aperto: lo porta in primo piano
  const profili = await glProfili();
  if (!profili.length) {
    try { await glAvvia(id, '', ''); toast(`${g.nome} avviato`); } catch (e) { toast('Errore: ' + e, true); }
    return;
  }
  chiGioca(g, profili);
}

function lightbox(urls, i) {
  const el = document.createElement('div'); el.className = 'lightbox';
  const mostra = () => {
    el.innerHTML = `<img src="${urls[i]}"><button class="chiudi" data-a="x">${I('x', 22)}</button>
      ${urls.length > 1 ? `<button class="freccia" data-a="-1" style="left:30px">${I('left', 24)}</button><button class="freccia" data-a="1" style="right:30px">${I('right', 24)}</button><div class="conta-lb">${i + 1} / ${urls.length}</div>` : ''}`;
  };
  const chiudi = () => { el.remove(); document.removeEventListener('keydown', tasti); };
  const sposta = (d) => { i = (i + d + urls.length) % urls.length; mostra(); };
  const tasti = (e) => { if (e.key === 'Escape') chiudi(); if (e.key === 'ArrowRight') sposta(1); if (e.key === 'ArrowLeft') sposta(-1); };
  el.onclick = (e) => { const a = e.target.closest('[data-a]')?.dataset.a; if (a && a !== 'x') sposta(+a); else if (e.target.tagName !== 'IMG') chiudi(); };
  mostra(); document.addEventListener('keydown', tasti); document.body.appendChild(el);
}

function conferma(titolo, testo, ok) {
  return new Promise((ris) => {
    const v = document.createElement('div'); v.className = 'velo-mod';
    v.innerHTML = `<div class="mod conferma"><div class="mod-testa"><div><h2>${titolo}</h2></div></div>
      <div class="mod-corpo">${testo}</div>
      <div class="mod-piede"><button class="btn" data-r="0">Annulla</button><button class="btn pericolo" data-r="1">${I('trash', 16)} ${ok}</button></div></div>`;
    v.onclick = (e) => { const r = e.target.closest('[data-r]'); if (r || e.target === v) { v.remove(); ris(r?.dataset.r === '1'); } };
    $('#modali').appendChild(v);
  });
}

/* ---------- aggiungi / modifica ---------- */
function apriForm(gioco, sorgenteIniziale) {
  const modifica = !!gioco;
  const st = {
    sorgente: sorgenteIniziale || null,
    copertina: null,
    copertinaUrl: gioco?.copertinaUrl || null,
    fotoTenute: gioco ? gioco.fotoUrl.map((f) => ({ ...f })) : [],
    fotoNuove: [],
  };
  const v = document.createElement('div'); v.className = 'velo-mod';
  v.innerHTML = `<div class="mod">
    <div class="mod-testa">
      <div><h2>${modifica ? 'Modifica gioco' : 'Aggiungi un gioco'}</h2>

      <button class="icona-btn" id="x">${I('x', 18)}</button>
    </div>
    <div class="mod-corpo">
      <div id="zonaSorgente"></div>
      <div id="campi" class="${modifica || st.sorgente ? '' : 'nascosto'}">
        <div class="form">
          <div class="campo"><label>Copertina</label><div class="scegli-cop" id="copPick">${I('image', 26, 1.6)}<span>Clicca o trascina<br>un'immagine</span></div></div>
          <div>
            <div class="campo"><label>Nome del gioco</label><input id="nome" maxlength="80" placeholder="Es. The Space Storm"></div>
            <div class="campo"><label>Descrizione</label><textarea id="descr" placeholder="Di cosa parla il gioco, i comandi, le novità…"></textarea></div>
          </div>
        </div>
        <div class="campo" style="margin-top:22px"><label>Foto del gioco</label><div class="foto-griglia" id="thumbs"></div></div>
      </div>
      <div class="errore" id="err"></div>
    </div>
    <div class="mod-piede"><button class="btn" id="annulla">Annulla</button><button class="btn primario" id="salva">${modifica ? I('check', 16, 2.4) + ' Salva modifiche' : I('plus', 16, 2.4) + ' Aggiungi alla libreria'}</button></div>
  </div>`;
  $('#modali').appendChild(v);
  const chiudi = () => v.remove();
  $('#x', v).onclick = chiudi; $('#annulla', v).onclick = chiudi;
  v.onmousedown = (e) => { if (e.target === v) chiudi(); };
  if (modifica) { $('#nome', v).value = gioco.nome; $('#descr', v).value = gioco.descrizione || ''; }
  const err = (m) => ($('#err', v).innerHTML = m ? I('alert', 16) + `<span>${esc(m)}</span>` : '');

  function impostaSorgente(s) {
    if (!s) return;
    if (s.errore) return err(s.errore);
    err(''); st.sorgente = s;
    if (!$('#nome', v).value) $('#nome', v).value = s.nome;
    $('#campi', v).classList.remove('nascosto');
    disegnaSorgente(); $('#nome', v).focus();
  }

  function disegnaSorgente() {
    const z = $('#zonaSorgente', v);
    if (modifica) { z.innerHTML = ''; return; }
    if (!st.sorgente) {
      z.innerHTML = `<div class="drop" id="drop">
        <div class="ic">${I('upload', 28)}</div>
        <h4>Trascina qui il tuo gioco</h4>
        <p>Un file <b>.html</b> oppure la cartella che contiene il gioco</p>
        <div class="azioni"><button class="btn" id="pHtml">${I('file', 16)} Scegli file HTML</button><button class="btn" id="pDir">${I('folder', 16)} Scegli cartella</button></div></div>`;
      $('#pHtml', z).onclick = async () => impostaSorgente(await api.scegliHtml());
      $('#pDir', z).onclick = async () => impostaSorgente(await api.scegliCartella());
      const d = $('#drop', z);
      d.ondragover = (e) => { e.preventDefault(); e.stopPropagation(); d.classList.add('sopra'); };
      d.ondragleave = () => d.classList.remove('sopra');
      d.ondrop = async (e) => { e.preventDefault(); e.stopPropagation(); d.classList.remove('sopra'); const en = voce(e.dataTransfer); if (en) impostaSorgente(await daEntry(en)); };
      return;
    }
    const s = st.sorgente;
    z.innerHTML = `<div class="sorgente">
      <div class="ic">${I(s.tipo === 'cartella' ? 'folder' : 'file', 20)}</div>

        ${s.entries.length > 1 ? `<select id="entry">${s.entries.map((e) => `<option ${e === s.entry ? 'selected' : ''}>${esc(e)}</option>`).join('')}</select>` : ''}</div>
      <button class="btn" id="cambia">Cambia</button></div>`;
    $('#cambia', z).onclick = () => { st.sorgente = null; disegnaSorgente(); };
    const sel = $('#entry', z); if (sel) sel.onchange = () => (s.entry = sel.value);
  }

  function disegnaCopertina() {
    const c = $('#copPick', v); const u = st.copertina?.url || st.copertinaUrl;
    c.classList.toggle('piena', !!u);
    c.style.backgroundImage = u ? `url("${u}")` : '';
  }
  const cp = $('#copPick', v);
  cp.onclick = async () => { const [i] = await api.scegliImmagini(false); if (i) { st.copertina = i; disegnaCopertina(); } };
  cp.ondragover = (e) => { e.preventDefault(); e.stopPropagation(); };
  cp.ondrop = async (e) => { e.preventDefault(); e.stopPropagation(); const f = e.dataTransfer.files[0]; const i = f && await immagineDaFile(f); if (i) { st.copertina = i; disegnaCopertina(); } else err('Trascina un\'immagine (png, jpg, webp…).'); };

  function disegnaFoto() {
    const t = $('#thumbs', v);
    const tutte = [...st.fotoTenute.map((f, i) => ({ url: f.url, k: 't', i })), ...st.fotoNuove.map((f, i) => ({ url: f.url, k: 'n', i }))];
    t.innerHTML = tutte.map((f) => `<div class="foto" style="${bg(f.url)}"><button class="togli" data-k="${f.k}" data-i="${f.i}">${I('x', 14, 2.5)}</button></div>`).join('')
      + `<div class="foto agg" id="addFoto">${I('plus', 16)} Aggiungi</div>`;
    t.querySelectorAll('.togli').forEach((b) => (b.onclick = () => { (b.dataset.k === 't' ? st.fotoTenute : st.fotoNuove).splice(+b.dataset.i, 1); disegnaFoto(); }));
    $('#addFoto', t).onclick = async () => { st.fotoNuove.push(...(await api.scegliImmagini(true))); disegnaFoto(); };
  }
  const th = $('#thumbs', v);
  th.ondragover = (e) => { e.preventDefault(); e.stopPropagation(); };
  th.ondrop = async (e) => {
    e.preventDefault(); e.stopPropagation();
    const lista = [...e.dataTransfer.files]; for (const f of lista) { const i = await immagineDaFile(f); if (i) st.fotoNuove.push(i); }
    disegnaFoto();
  };

  $('#salva', v).onclick = async () => {
    const nome = $('#nome', v).value.trim();
    if (!modifica && !st.sorgente) return err('Prima carica il file o la cartella del gioco.');
    if (!nome) return err('Dai un nome al gioco.');
    const m = $('.mod', v); m.classList.add('attesa'); $('#salva', v).textContent = 'Salvataggio…';
    try {
      let g;
      if (modifica) {
        g = await api.aggiorna({ id: gioco.id, nome, descrizione: $('#descr', v).value, copertinaNuova: st.copertina?.path, fotoTenute: st.fotoTenute.map((f) => f.rel), fotoNuove: st.fotoNuove.map((f) => f.path) });
      } else {
        g = await api.aggiungi({ tipo: st.sorgente.tipo, path: st.sorgente.path, entry: st.sorgente.entry, nome, descrizione: $('#descr', v).value, copertina: st.copertina?.path, foto: st.fotoNuove.map((f) => f.path) });
      }
      chiudi(); await ricarica(); vai({ tipo: 'gioco', id: g.id });
      toast(modifica ? 'Modifiche salvate' : 'Gioco aggiunto alla libreria');
    } catch (e) {
      m.classList.remove('attesa'); $('#salva', v).textContent = 'Riprova'; err('Errore: ' + e.message);
    }
  };

  disegnaSorgente(); disegnaCopertina(); disegnaFoto();
}

function attivaOcchi(el) {

// finestra generica con campi: onOk riceve la finestra e lancia un errore (testo) se qualcosa non va
function finestra({ titolo, sotto = '', corpo, ok, pericolo = false, onOk, larghezza = 460 }) {
  const v = document.createElement('div'); v.className = 'velo-mod';
  v.innerHTML = `<div class="mod" style="width:min(${larghezza}px,100%)">
    <div class="mod-testa"><div><h2>${titolo}</h2>${sotto ? `<p>${sotto}</p>` : ''}</div><button class="icona-btn" data-x>${I('x', 18)}</button></div>
    <div class="mod-corpo">${corpo}<div class="errore" data-err></div></div>
    <div class="mod-piede"><button class="btn" data-x>Annulla</button><button class="btn ${pericolo ? 'pericolo' : 'primario'}" data-ok>${ok}</button></div></div>`;
  $('#modali').appendChild(v);
  const chiudi = () => v.remove();
  v.querySelectorAll('[data-x]').forEach((b) => (b.onclick = chiudi));
  v.onmousedown = (e) => { if (e.target === v) chiudi(); };
  attivaOcchi(v);
  const bOk = v.querySelector('[data-ok]'), err = v.querySelector('[data-err]');
  const invia = async () => {
    err.innerHTML = ''; const testo = bOk.innerHTML; bOk.disabled = true; bOk.innerHTML = '<span class="giro"></span>';
    try { await onOk(v); chiudi(); }
    catch (e) { err.innerHTML = I('alert', 16) + `<span>${esc(String(e && e.message ? e.message : e))}</span>`; v.querySelector('.mod').classList.remove('scuoti'); void v.offsetWidth; v.querySelector('.mod').classList.add('scuoti'); }
    finally { bOk.disabled = false; bOk.innerHTML = testo; }
  };
  bOk.onclick = invia;
  v.addEventListener('keydown', (e) => { if (e.key === 'Enter' && e.target.tagName === 'INPUT') invia(); if (e.key === 'Escape') chiudi(); });
  setTimeout(() => v.querySelector('input')?.focus(), 50);
  return v;
}

  const v = document.createElement('div'); v.className = 'velo-mod';

    <div class="mod-piede sx">
      <button class="btn" id="ospite" title="I progressi da ospite non sono protetti">${I('pad', 16)} Gioca come ospite</button>
      <div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn" id="accediDaGioco">${I('login', 16)} Accedi da file</button><button class="btn" id="nuovoDaGioco">${I('plus', 16)} Nuovo profilo</button></div>

/* ---------- sincronizzazione e backup ---------- */
function rilevaGpu() {
  try {
    const c = document.createElement('canvas');
    const gl = c.getContext('webgl') || c.getContext('experimental-webgl');
    if (!gl) return { nome: 'Accelerazione grafica non disponibile', software: true };
    const e = gl.getExtension('WEBGL_debug_renderer_info');
    const r = String(e ? gl.getParameter(e.UNMASKED_RENDERER_WEBGL) : gl.getParameter(gl.RENDERER));
    gl.getExtension('WEBGL_lose_context')?.loseContext();
    return { nome: nomeGpu(r), software: /swiftshader|basic render|llvmpipe|software/i.test(r) };
  } catch (e) { return { nome: 'Non rilevata', software: false }; }
}
function nomeGpu(s) {
  const m = s.match(/ANGLE \([^,]*,\s*(.+?)(\s*\(0x[0-9a-f]+\))?\s*(Direct3D|OpenGL|Vulkan|,)/i);
  return (m ? m[1] : s).trim();
}

  passo('lettura', 'corso');

    if (annullato) return;
    if (d.fase === 'info') {
      passo('lettura', 'fatto', `${d.info.numFile} file · ${peso(d.info.dimensione)}`);
      passo('info', 'fatto', d.info.comandi.length ? 'Comandi: ' + d.info.comandi.join(', ') : 'Nessun comando particolare trovato');
      if (!g && d.info.nome) $('#anNome', v).textContent = d.info.nome;
      $('#anChips', v).innerHTML = d.info.tecnologie.map((t) => `<span class="chip">${esc(t)}</span>`).join('');
      if (d.info.copertina) { $('#anCop', v).classList.remove('vuota'); $('#anCop', v).style.backgroundImage = `url("${d.info.copertina.url}")`; }
      d.info.fotoTrovate.forEach((f) => mostraFoto(f.url));
    }
    if (d.fase === 'foto') passo('foto', 'corso');
    if (d.fase === 'scatto') mostraFoto(d.img.url);

  if (annullato) return;

  const nome = g ? g.nome : (info.nome || sorgente.nome);

  }

        copertinaNuova: tieniCopertina ? undefined : copertina, copertinaAuto: auto,

        tecnologie: info.tecnologie, comandi: info.comandi });
    } else {
      passo('salva', 'corso');

        descrizione: info.descrizione, copertina, copertinaAuto: auto, foto: foto.map((f) => f.path),
        tecnologie: info.tecnologie, comandi: info.comandi, numFile: info.numFile, dimensione: info.dimensione });
      passo('salva', 'fatto');

    await new Promise((r) => setTimeout(r, 450));

    toast(g ? 'Foto e copertina aggiornate' : `${nome} aggiunto alla libreria`);

    v.remove(); toast('Errore: ' + e, true);
  }

/* copertina 600×800 creata dalle foto: sfondo sfocato, foto incorniciata, titolo grande */
function caricaImg(url) {
  return new Promise((ok) => { const im = new Image(); im.onload = () => ok(im); im.onerror = () => ok(null); im.src = url; });
}
function vivacita(im) {
  const c = document.createElement('canvas'); c.width = 32; c.height = 18;
  const x = c.getContext('2d'); x.drawImage(im, 0, 0, 32, 18);
  const d = x.getImageData(0, 0, 32, 18).data; let sat = 0, lum = [], m = 0;
  for (let i = 0; i < d.length; i += 4) {
    const mx = Math.max(d[i], d[i + 1], d[i + 2]), mn = Math.min(d[i], d[i + 1], d[i + 2]);
    sat += mx - mn; const l = (d[i] + d[i + 1] + d[i + 2]) / 3; lum.push(l); m += l;
  }
  m /= lum.length; const varianza = lum.reduce((a, l) => a + (l - m) ** 2, 0) / lum.length;
  return sat / lum.length + Math.sqrt(varianza);
}
async function creaCopertina(nome, urls, tecnologia) {
  const W = 600, H = 800;
  const c = document.createElement('canvas'); c.width = W; c.height = H;
  const x = c.getContext('2d');
  const imgs = (await Promise.all(urls.map(caricaImg))).filter(Boolean);
  let foto = null, best = -1;
  for (const im of imgs) { const s = vivacita(im); if (s > best) { best = s; foto = im; } }
  const h = tinta(nome);
  const g = x.createLinearGradient(0, 0, W, H);
  g.addColorStop(0, `hsl(${h} 55% 30%)`); g.addColorStop(1, `hsl(${(h + 45) % 360} 60% 9%)`);
  x.fillStyle = g; x.fillRect(0, 0, W, H);
  let fondoFoto = 120;
  if (foto) {
    const r = Math.max(W / foto.width, H / foto.height) * 1.15;
    x.save(); x.filter = 'blur(26px) saturate(1.3) brightness(.62)';
    x.drawImage(foto, (W - foto.width * r) / 2, (H - foto.height * r) / 2, foto.width * r, foto.height * r);
    x.restore();
    const fw = 520, fh = Math.min(380, fw * foto.height / foto.width), fx = 40, fy = 70;
    x.save(); x.shadowColor = 'rgba(0,0,0,.55)'; x.shadowBlur = 40; x.shadowOffsetY = 16;
    x.beginPath(); x.roundRect(fx, fy, fw, fh, 18); x.fillStyle = '#000'; x.fill(); x.restore();
    x.save(); x.beginPath(); x.roundRect(fx, fy, fw, fh, 18); x.clip();
    const rr = Math.max(fw / foto.width, fh / foto.height);
    x.drawImage(foto, fx + (fw - foto.width * rr) / 2, fy + (fh - foto.height * rr) / 2, foto.width * rr, foto.height * rr);
    x.restore();
    x.strokeStyle = 'rgba(255,255,255,.18)'; x.lineWidth = 2; x.beginPath(); x.roundRect(fx, fy, fw, fh, 18); x.stroke();
    fondoFoto = fy + fh;
  } else {
    x.font = '700 300px "Segoe UI Variable Display","Segoe UI",sans-serif'; x.fillStyle = 'rgba(255,255,255,.07)';
    x.textAlign = 'center'; x.fillText(iniziali(nome), W / 2, 380); x.textAlign = 'left';
  }
  const ombra = x.createLinearGradient(0, fondoFoto, 0, H);
  ombra.addColorStop(0, 'rgba(8,9,14,0)'); ombra.addColorStop(.45, 'rgba(8,9,14,.75)'); ombra.addColorStop(1, 'rgba(8,9,14,.95)');
  x.fillStyle = ombra; x.fillRect(0, fondoFoto, W, H - fondoFoto);
  // titolo: va a capo e si rimpicciolisce finché sta in 3 righe
  const parole = nome.toUpperCase().split(/\s+/);
  let size = 84, righe;
  for (; size >= 34; size -= 4) {
    x.font = `800 ${size}px "Segoe UI Variable Display","Segoe UI",sans-serif`;
    righe = []; let r = '';
    for (const p of parole) { const t = r ? r + ' ' + p : p; if (x.measureText(t).width > 520 && r) { righe.push(r); r = p; } else r = t; }
    righe.push(r);
    if (righe.length <= 3 && righe.every((l) => x.measureText(l).width <= 520)) break;
  }
  const lh = size * 1.02, base = H - 62;
  x.fillStyle = '#fff'; x.shadowColor = 'rgba(0,0,0,.5)'; x.shadowBlur = 18;
  righe.forEach((l, i) => x.fillText(l, 40, base - (righe.length - 1 - i) * lh));
  x.shadowBlur = 0;
  const yTag = base - (righe.length - 1) * lh - size - 18;
  const acc = x.createLinearGradient(40, 0, 110, 0); acc.addColorStop(0, '#5b8cff'); acc.addColorStop(1, '#8b5cf6');
  x.fillStyle = acc; x.beginPath(); x.roundRect(40, yTag - 6, 56, 6, 3); x.fill();
  if (tecnologia) {
    x.font = '700 16px "Segoe UI",sans-serif'; x.fillStyle = 'rgba(255,255,255,.72)';
    try { x.letterSpacing = '3px'; } catch (e) {}
    x.fillText(tecnologia.toUpperCase(), 108, yTag);
  }
  const dati = c.toDataURL('image/jpeg', 0.92).split(',')[1];
  return await glImmagineTemp('copertina.jpg', dati);
}

function sistemaIA() {
  const oggi = new Date().toLocaleDateString('it-IT', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' });
  const lib = giochi.slice(0, 60).map((g) => `- ${g.nome}${g.descrizione ? ': ' + g.descrizione.slice(0, 160) : ''}`).join('\n');

function erroreIA(stato, testo, fornitore) {
  const t = String(testo || '');
  if (stato === 0) return 'Nessuna connessione a internet: controlla la rete e riprova.';
  if (stato === 401 || stato === 403 || /API_KEY_INVALID|API key not valid|invalid x-api-key|authentication/i.test(t)) return `La chiave di ${FORNITORI[fornitore].nome} non è valida. Controllala nelle impostazioni dell'assistente.`;
  if (stato === 429) return 'Hai raggiunto il limite di richieste della tua chiave. Aspetta un po\' e riprova.';
  if (/credit balance|billing|insufficient/i.test(t)) return 'Il credito del tuo account è finito: ricaricalo dal sito del fornitore.';
  if (stato >= 500) return 'Il servizio è momentaneamente sovraccarico. Riprova tra qualche secondo.';
  return 'Errore dal servizio IA: ' + (t || 'codice ' + stato);
}
async function chiamaIA(url, opz, fornitore) {
  let r;
  try { r = await fetch(url, { ...opz, signal: IA.ctrl?.signal }); }
  catch (e) { if (e.name === 'AbortError') throw e; const err = new Error(erroreIA(0, '', fornitore)); err.stato = 0; throw err; }
  const j = await r.json().catch(() => ({}));
  if (!r.ok) { const err = new Error(erroreIA(r.status, j.error?.message || j.message, fornitore)); err.stato = r.status; err.grezzo = j.error?.message || ''; throw err; }
  return j;
}

/* --- Google Gemini con la ricerca Google --- */
async function modelloGemini(chiave) {
  if (IA.modelli['g' + chiave]) return IA.modelli['g' + chiave];
  let scelto = 'gemini-2.5-flash';
  try {
    const j = await chiamaIA('https://generativelanguage.googleapis.com/v1beta/models?pageSize=1000&key=' + encodeURIComponent(chiave), {}, 'gemini');
    const l = (j.models || []).map((m) => ({ id: m.name.replace(/^models\//, ''), metodi: m.supportedGenerationMethods || [] }))
      .map((m) => ({ ...m, v: (m.id.match(/^gemini-(\d+(?:\.\d+)?)-flash$/) || [])[1] }))
      .filter((m) => m.v && m.metodi.includes('generateContent')).sort((a, b) => parseFloat(b.v) - parseFloat(a.v));
    if (l.length) scelto = l[0].id;
  } catch (e) { if (e.stato === 400 || e.stato === 401 || e.stato === 403 || e.stato === 0 || e.name === 'AbortError') throw e; }
  return (IA.modelli['g' + chiave] = scelto);
}
async function chiediGemini(chiave, storia, conRicerca) {
  const modello = await modelloGemini(chiave);
  const corpo = {
    system_instruction: { parts: [{ text: sistemaIA() }] },
    contents: storia.map((m) => ({ role: m.ruolo === 'utente' ? 'user' : 'model', parts: [{ text: m.testo }] })),
  };
  if (conRicerca) corpo.tools = [{ google_search: {} }];
  const j = await chiamaIA(`https://generativelanguage.googleapis.com/v1beta/models/${modello}:generateContent?key=${encodeURIComponent(chiave)}`,
    { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify(corpo) }, 'gemini');
  const c = (j.candidates || [])[0];
  if (!c) throw new Error(j.promptFeedback?.blockReason ? 'La domanda è stata bloccata dai filtri di Google.' : 'Nessuna risposta dall\'IA.');
  const testo = (c.content?.parts || []).filter((p) => p.text && !p.thought).map((p) => p.text).join('');
  const gm = c.groundingMetadata || {};
  const fonti = (gm.groundingChunks || []).map((x) => x.web).filter(Boolean).map((w) => ({ titolo: w.title || w.uri, url: w.uri }));
  return { testo, fonti, ricerche: gm.webSearchQueries || [] };
}

/* --- Claude con la ricerca web --- */
async function modelloClaude(chiave, h) {
  if (IA.modelli['c' + chiave]) return IA.modelli['c' + chiave];
  let scelto = 'claude-sonnet-5-5';
  try {

    const ids = (j.data || []).map((m) => m.id);
    scelto = ids.find((x) => /sonnet/.test(x)) || ids[0] || scelto;
  } catch (e) { if (e.stato === 401 || e.stato === 403 || e.stato === 0 || e.name === 'AbortError') throw e; }
  return (IA.modelli['c' + chiave] = scelto);
}
async function chiediClaude(chiave, storia, conRicerca) {
  const h = { 'x-api-key': chiave, 'anthropic-version': '2023-06-01', 'content-type': 'application/json', 'anthropic-dangerous-direct-browser-access': 'true' };
  const modello = await modelloClaude(chiave, h);
  const messaggi = storia.map((m) => ({ role: m.ruolo === 'utente' ? 'user' : 'assistant', content: m.testo }));
  let testo = '', fonti = [], ricerche = [];
  for (let giro = 0; giro < 4; giro++) {
    const corpo = { model: modello, max_tokens: 4096, system: sistemaIA(), messages: messaggi };
    if (conRicerca) corpo.tools = [{ type: 'web_search_20250305', name: 'web_search', max_uses: 5 }];
    const j = await chiamaIA('https://api.anthropic.com/v1/messages', { method: 'POST', headers: h, body: JSON.stringify(corpo) }, 'claude');
    for (const b of j.content || []) {
      if (b.type === 'text') { testo += b.text; for (const c of b.citations || []) if (c.url) fonti.push({ titolo: c.title || c.url, url: c.url }); }
      else if (b.type === 'server_tool_use' && b.input?.query) ricerche.push(b.input.query);
      else if (b.type === 'web_search_tool_result' && b.content?.error_code) {} // ricerca fallita: risponde comunque
    }

  }
  return { testo, fonti, ricerche };
}

async function rispondiIA(chiave, fornitore, storia) {
  const f = fornitore === 'claude' ? chiediClaude : chiediGemini;
  try { return await f(chiave, storia, true); }
  catch (e) {

    if (e.name === 'AbortError' || ![400, 403, 404].includes(e.stato) || /API_KEY_INVALID|API key not valid|invalid x-api-key/i.test(e.grezzo || '')) throw e;
    const r = await f(chiave, storia, false);
    r.senzaRicerca = true;
    return r;
  }
}

/* testo dell'IA -> HTML sicuro (grassetto, corsivo, codice, titoli, elenchi, link) */
function mdIA(t) {
  const linea = (s) => esc(s)
    .replace(/`([^`]+)`/g, '<code>$1</code>')
    .replace(/\*\*(.+?)\*\*/g, '<b>$1</b>')
    .replace(/(^|[\s(])\*([^*\s][^*]*?)\*(?=[\s).,;:!?]|$)/g, '$1<i>$2</i>')
    .replace(/\[([^\]]+)\]\((https?:\/\/[^)\s]+)\)/g, (m, a, u) => `<a data-url="${u}">${a}</a>`)
    .replace(/(^|[\s(])(https?:\/\/[^\s<)]+[^\s<).,;:!?])/g, (m, a, u) => `${a}<a data-url="${u}">${u.replace(/^https?:\/\/(www\.)?/, '').slice(0, 48)}</a>`);
  const out = []; let lista = null;
  const chiudi = () => { if (lista) { out.push(`</${lista}>`); lista = null; } };
  for (const r of String(t).replace(/\r/g, '').split('\n')) {
    let m;
    if ((m = r.match(/^\s*[-*•]\s+(.*)/))) { if (lista !== 'ul') { chiudi(); out.push('<ul>'); lista = 'ul'; } out.push(`<li>${linea(m[1])}</li>`); }
    else if ((m = r.match(/^\s*\d+[.)]\s+(.*)/))) { if (lista !== 'ol') { chiudi(); out.push('<ol>'); lista = 'ol'; } out.push(`<li>${linea(m[1])}</li>`); }
    else if ((m = r.match(/^#{1,6}\s+(.*)/))) { chiudi(); out.push(`<h4>${linea(m[1])}</h4>`); }
    else if (!r.trim()) { chiudi(); out.push('<div class="spazio"></div>'); }
    else { chiudi(); out.push(`<p>${linea(r)}</p>`); }
  }
  chiudi();
  return out.join('');
}
function dominio(u) { try { return new URL(u).hostname.replace(/^www\./, ''); } catch (e) { return u; } }

function bollaIA(m) {
  if (m.ruolo === 'utente') return `<div class="msg utente"><div class="bolla">${esc(m.testo).replace(/\n/g, '<br>')}</div></div>`;
  if (m.attesa) return `<div class="msg ia"><div class="av-ia">${I('spark', 16)}</div><div class="bolla"><div class="pensa"><span class="giro"></span> Cerco sul web e preparo la risposta…</div></div></div>`;
  if (m.errore) return `<div class="msg ia"><div class="av-ia">${I('spark', 16)}</div><div class="bolla errore-ia">${I('alert', 16)}<span>${esc(m.errore)}</span></div></div>`;
  const viste = new Set(), fonti = (m.fonti || []).filter((f) => !viste.has(f.url) && viste.add(f.url)).slice(0, 10);
  return `<div class="msg ia"><div class="av-ia">${I('spark', 16)}</div><div class="bolla">
    ${m.ricerche?.length ? `<div class="cercato">${I('search', 13)} Ho cercato: ${m.ricerche.slice(0, 4).map((q) => `<a data-url="https://www.google.com/search?q=${encodeURIComponent(q)}">${esc(q)}</a>`).join(', ')}</div>` : ''}
    <div class="md">${mdIA(m.testo || '(nessun testo)')}</div>
    ${fonti.length ? `<div class="fonti"><small>Fonti</small>${fonti.map((f, i) => `<a class="fonte" data-url="${esc(f.url)}" title="${esc(f.url)}"><span class="n">${i + 1}</span>${esc(f.titolo.length > 60 ? f.titolo.slice(0, 58) + '…' : f.titolo)}<em>${esc(/vertexaisearch/.test(f.url) ? '' : dominio(f.url))}</em></a>`).join('')}</div>` : ''}
    ${m.senzaRicerca ? `<div class="senza">${I('info', 13)} Risposta senza ricerca sul web: la tua chiave non include la ricerca, quindi le informazioni potrebbero non essere aggiornate.</div>` : ''}
  </div></div>`;
}

async function disegnaIA() {
  const app = $('#app');
  const cfg = await glConfigIA();
  if (vista.tipo !== 'ia') return;
  const bozza = $('#domanda')?.value || '';
  const F = FORNITORI[cfg.fornitore];
  const esempi = [
    giochi[0] ? `Trucchi e consigli per ${giochi[0].nome}` : 'Quali sono i giochi più giocati in questo momento?',
    'Che novità ci sono oggi nel mondo dei videogiochi?',
    giochi[1] ? `Di che genere è ${giochi[1].nome}? Consigliami giochi simili` : 'Come si crea un gioco HTML semplice?',
    'Che tempo fa domani a Roma?',
  ];
  app.innerHTML = `<div class="vista pagina chat">
    <div class="chat-testa">
      <div><h1>Assistente</h1><p class="sub2">${cfg.chiave ? `${esc(F.nome)} · ${I('search', 13)} ${esc(F.ricerca)}` : 'Fai una domanda: cerca sul web e ti risponde con le fonti.'}</p></div>
      <div class="azioni">
        ${IA.messaggi.length ? `<button class="btn" id="nuovaChat">${I('again', 16)} Nuova chat</button>` : ''}
        <button class="icona-btn" id="impIA" data-tip="Impostazioni dell'assistente">${I('key', 17)}</button>
      </div>
    </div>
    <div class="messaggi" id="messaggi">${cfg.chiave ? (IA.messaggi.length ? IA.messaggi.map(bollaIA).join('') : `
      <div class="benvenuto"><div class="av-ia grande">${I('spark', 28)}</div><h2>Chiedimi qualcosa</h2><p>Cerco su internet e ti rispondo con le fonti da controllare.</p>
        <div class="esempi">${esempi.map((e) => `<button class="esempio">${esc(e)}</button>`).join('')}</div></div>`)
      : `<div class="card-imp riga-imp"><div class="ic-imp">${I('key', 24)}</div><div style="flex:1"><h3>Collega l'intelligenza artificiale</h3>
        <p>L'assistente usa un servizio IA che cerca su internet prima di rispondere. Serve una chiave personale (si crea in un minuto) e la connessione a internet.</p>
        <div class="azioni" style="margin-top:16px"><button class="btn primario" id="configIA">${I('key', 16)} Inserisci la chiave</button></div></div></div>`}
    </div>
    ${cfg.chiave ? `<div class="scrivi"><textarea id="domanda" rows="1" placeholder="Scrivi una domanda…" ${IA.occupato ? 'disabled' : ''}></textarea>
      <button class="btn primario invia" id="invia" ${IA.occupato ? 'disabled' : ''}>${I('send', 17)}</button></div>
      <div class="avvertenza">L'IA può sbagliare: controlla le fonti per le cose importanti.</div>` : ''}
  </div>`;
  app.querySelectorAll('[data-url]').forEach((a) => (a.onclick = () => apriLink(a.dataset.url)));
  $('#impIA').onclick = () => impostazioniIA(true);
  if ($('#configIA')) $('#configIA').onclick = () => impostazioniIA(true);
  if ($('#nuovaChat')) $('#nuovaChat').onclick = () => { IA.ctrl?.abort(); IA.messaggi = []; IA.occupato = false; disegnaIA(); };
  app.querySelectorAll('.esempio').forEach((b) => (b.onclick = () => inviaIA(b.textContent)));
  const ta = $('#domanda');
  if (ta) {
    const cresci = () => { ta.style.height = 'auto'; ta.style.height = Math.min(ta.scrollHeight, 180) + 'px'; };
    ta.value = bozza; cresci();
    ta.oninput = cresci;
    ta.onkeydown = (e) => { if (e.key === 'Enter' && !e.shiftKey && !e.isComposing) { e.preventDefault(); inviaIA(ta.value); } };
    $('#invia').onclick = () => inviaIA(ta.value);
    if (!IA.occupato && matchMedia('(hover:hover)').matches) ta.focus();
  }
  const sc = app.closest('.contenuto') || app; sc.scrollTop = sc.scrollHeight;
}

async function inviaIA(testo) {
  testo = String(testo || '').trim();
  if (!testo || IA.occupato) return;
  const cfg = await glConfigIA();
  if (!cfg.chiave) return impostazioniIA(true);
  if ($('#domanda')) $('#domanda').value = '';
  IA.messaggi.push({ ruolo: 'utente', testo });
  const attesa = { ruolo: 'ia', attesa: true };
  IA.messaggi.push(attesa); IA.occupato = true; IA.ctrl = new AbortController();
  const ctrl = IA.ctrl;
  if (vista.tipo === 'ia') disegnaIA();
  const storia = IA.messaggi.filter((m) => !m.attesa && !m.errore && m.testo).slice(-20);
  let r;
  try { r = await rispondiIA(cfg.chiave, cfg.fornitore, storia); }
  catch (e) { if (e.name === 'AbortError' || ctrl !== IA.ctrl) return; r = { errore: e.message || String(e) }; }
  if (ctrl !== IA.ctrl) return; // chat ricominciata nel frattempo
  Object.assign(attesa, { attesa: false }, r);
  IA.occupato = false; IA.ctrl = null;
  if (vista.tipo === 'ia') disegnaIA(); else toast('L\'assistente ha risposto');
}

async function impostazioniIA() {
  const cfg = await glConfigIA();
  let forn = cfg.fornitore;
  const v = document.createElement('div'); v.className = 'velo-mod';
  const corpo = () => {
    const F = FORNITORI[forn];
    return `<div class="segmenti scelta-ia">${Object.entries(FORNITORI).map(([k, f]) => `<button data-f="${k}" class="${forn === k ? 'on' : ''}">${esc(f.nome)}</button>`).join('')}</div>
      <ol class="passi-num">
        <li>Apri <a data-url="${F.link}">${esc(F.dove)}</a> ed entra con il tuo account${forn === 'gemini' ? ' Google' : ''}.</li>
        <li>Crea una chiave (API key) e copiala.</li>
        <li>Incollala qui sotto e premi <b>Salva</b>.</li>
      </ol>
      <p class="nota-ia">${forn === 'gemini'
        ? 'La chiave di Google è gratuita. La <b>ricerca Google</b> dentro le risposte però è inclusa solo se attivi la fatturazione nel progetto (con migliaia di ricerche gratuite al mese); senza, l\'assistente risponde lo stesso ma senza cercare sul web.'
        : 'Claude è a pagamento: si ricarica il credito nella Console. Ogni ricerca sul web costa circa 1 centesimo, più il costo della risposta.'}</p>
      <label class="lab-ia">Chiave ${esc(F.nome)}</label>
      <div class="riga-chiave"><input id="chiaveIA" type="password" autocomplete="off" spellcheck="false" placeholder="${F.esempio}" value="${forn === cfg.fornitore ? esc(cfg.chiave) : ''}"><button class="icona-btn" id="mostra" type="button">${I('eye', 16)}</button></div>
      <p class="nota-ia" style="margin-top:10px">${I('lock', 13)} La chiave resta solo su questo dispositivo${navigator.userAgent.includes('Windows') ? ', cifrata con il tuo account di Windows' : ''}. Le domande vengono inviate a ${esc(F.nome)}.</p>
      <div class="errore" id="errIA"></div>`;
  };
  v.innerHTML = `<div class="mod" style="width:min(560px,100%)">
    <div class="mod-testa"><div><h2>Assistente IA</h2><p>Scegli il servizio e inserisci la tua chiave.</p></div><button class="icona-btn" data-x>${I('x', 18)}</button></div>
    <div class="mod-corpo" id="corpoIA"></div>
    <div class="mod-piede">${cfg.chiave ? `<button class="btn pericolo" id="togliIA">${I('trash', 15)} Rimuovi chiave</button>` : ''}<span style="flex:1"></span>
      <button class="btn" data-x>Annulla</button><button class="btn primario" id="salvaIA">${I('check', 16)} Salva</button></div></div>`;
  $('#modali').appendChild(v);
  const chiudi = () => v.remove();
  const monta = () => {
    $('#corpoIA', v).innerHTML = corpo();
    v.querySelectorAll('[data-f]').forEach((b) => (b.onclick = () => { forn = b.dataset.f; monta(); }));
    v.querySelectorAll('#corpoIA [data-url]').forEach((a) => (a.onclick = () => apriLink(a.dataset.url)));
    $('#mostra', v).onclick = () => { const i = $('#chiaveIA', v); i.type = i.type === 'password' ? 'text' : 'password'; };
  };
  monta();
  v.querySelectorAll('[data-x]').forEach((b) => (b.onclick = chiudi));
  v.onmousedown = (e) => { if (e.target === v) chiudi(); };
  if ($('#togliIA', v)) $('#togliIA', v).onclick = async () => { await glSalvaIA(cfg.fornitore, ''); chiudi(); toast('Chiave rimossa'); if (vista.tipo === 'ia') disegnaIA(); };
  $('#salvaIA', v).onclick = async () => {
    const k = $('#chiaveIA', v).value.trim();
    const err = (t) => ($('#errIA', v).innerHTML = I('alert', 16) + `<span>${esc(t)}</span>`);
    if (!k) return err('Incolla la chiave.');
    if (forn === 'claude' && !/^sk-ant-/.test(k)) return err('Questa non sembra una chiave di Claude: inizia con sk-ant-');
    if (forn === 'gemini' && /^sk-/.test(k)) return err('Questa sembra una chiave di Claude: scegli Claude in alto.');
    await glSalvaIA(forn, k);
    chiudi(); toast('Assistente pronto');
    if (vista.tipo === 'ia') disegnaIA(); else vai({ tipo: 'ia' });
  };
}

/* ---------- trascinamento sulla finestra ---------- */
let contaDrag = 0;
const zona = $('#zonaDrop');
const haFile = (e) => [...(e.dataTransfer?.types || [])].includes('Files');
document.addEventListener('dragenter', (e) => { if (!haFile(e) || $('#modali').children.length) return; contaDrag++; zona.classList.add('on'); });
document.addEventListener('dragleave', () => { if (--contaDrag <= 0) { contaDrag = 0; zona.classList.remove('on'); } });
document.addEventListener('dragover', (e) => e.preventDefault());
document.addEventListener('drop', async (e) => {
  e.preventDefault(); contaDrag = 0; zona.classList.remove('on');
  if ($('#modali').children.length) return;
  const en = voce(e.dataTransfer); if (!en) return;
  const s = await daEntry(en);
  if (s.errore) return toast(s.errore, true);
  avviaAnalisi({ sorgente: s });
});

$('#navSync').onclick = () => vai({ tipo: 'sync' });

$('#navProfili').onclick = () => vai({ tipo: 'profili' });

$('#navIA').onclick = () => vai({ tipo: 'ia' });
$('#btnAggiungi').innerHTML = I('plus', 17, 2.4) + ' Aggiungi gioco';
$('#btnAggiungi').onclick = () => apriAggiungi();

document.addEventListener('keydown', (e) => { if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'f') { e.preventDefault(); $('#cerca').focus(); } });
ricarica();
